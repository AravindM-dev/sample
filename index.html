<!DOCTYPE html>
<html>
<head>
    <title>HTML CSS JS Demo</title>

    <!-- CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            margin: auto;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: #green;
        }

        button {
            padding: 10px 20px;
            background-color: #0052cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #003d99;
        }

        #message {
            font-size: 20px;
            color: green;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- HTML -->
    <div class="box">
        <h1>My Web Page</h1>

        <p>HTML + CSS + JavaScript in one file</p>

        <button onclick="showMessage()">Click Me</button>

        <div id="message"></div>
    </div>

    <!-- JavaScript -->
    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Hello! JavaScript is working 🎉";
        }
    </script>

</body>
</html>
